name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install page builder
        run: |
          python -m pip install --requirement requirements-pages.txt
          python -m playwright install --with-deps chromium

      - name: Run application tests
        run: |
          npm test
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Capture the exact rendered application pages
        run: python scripts/build-static-pages.py

      - name: Verify representative rendered pages
        run: |
          python scripts/verify-static-page-equivalence.py \
            --word forgjeves --word annen --word "a cappella" \
            --story Bakeriet --story "Svarte hull"
          python scripts/verify-static-page-equivalence.py \
            --root-mount --word forgjeves --story Bakeriet

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
